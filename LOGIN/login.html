<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos del sitio -->
  <link rel="stylesheet" href="globales.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="fondo-punteado">

  <div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="login-card">

      <!-- Marca -->
      <div class="text-center mb-4">
        <div class="icono-marca mx-auto mb-3">
          <i class="bi bi-lock-fill"></i>
        </div>
        <h1 class="h3 font-display mb-1">Bienvenido</h1>
        <p class="text-muted mb-0">Ingresá tus datos para acceder a tu cuenta</p>
      </div>

      <!-- Formulario (visual, sin lógica todavía) -->
      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="nombre@gmail.com">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="••••••••">
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="recordar">
            <label class="form-check-label small text-muted" for="recordar">
              Recuérdarme
            </label>
          </div>
          <a href="#" class="small link-primario">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
          Iniciar sesión
        </button>

        <p class="text-center text-muted small mb-0">
          ¿No tenés cuenta? <a href="#" class="link-primario fw-semibold">Registrate</a>
        </p>
      </form>

    </div>
  </div>

  <!-- Bootstrap Icons (para el ícono del candado) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</body>
</html>
