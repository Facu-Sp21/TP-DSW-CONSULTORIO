<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Vitalis</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos del sitio -->
  <link rel="stylesheet" href="../INDEX/globales.css">
  <link rel="stylesheet" href="registro.css">
</head>
<body class="fondo-punteado">

  <div class="registro-wrapper d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="registro-card">

      <!-- Marca -->
      <div class="text-center mb-4">
        <div class="icono-marca mx-auto mb-3">
          <i class="bi bi-person-plus-fill"></i>
        </div>
        <h1 class="h3 font-display mb-1">Creá tu cuenta</h1>
        <p class="text-muted mb-0">Completá tus datos para comenzar</p>
      </div>

      <!-- Formulario (visual, sin lógica todavía) -->
      <form>
        <div class="row">
          <div class="col-6 mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" placeholder="Juan">
          </div>
          <div class="col-6 mb-3">
            <label for="apellido" class="form-label">Apellido</label>
            <input type="text" class="form-control" id="apellido" placeholder="Pérez">
          </div>
        </div>

        <div class="row">
          <div class="col-6 mb-3">
            <label for="dni" class="form-label">DNI</label>
            <input type="text" class="form-control" id="dni" placeholder="38.123.456">
          </div>
          <div class="col-6 mb-3">
            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
            <input type="date" class="form-control" id="fechaNacimiento">
          </div>
        </div>

        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono</label>
          <input type="tel" class="form-control" id="telefono" placeholder="+54 9 11 1234-5678">
        </div>

        <div class="mb-3">
          <label for="emailRegistro" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="emailRegistro" placeholder="nombre@gmail.com">
        </div>

        <div class="row">
          <div class="col-6 mb-3">
            <label for="passwordRegistro" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="passwordRegistro" placeholder="••••••••">
          </div>
          <div class="col-6 mb-3">
            <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
            <input type="password" class="form-control" id="confirmarPassword" placeholder="••••••••">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
          Crear cuenta
        </button>

        <p class="text-center text-muted small mb-0">
          ¿Ya tenés cuenta? <a href="login.html" class="link-primario fw-semibold">Iniciá sesión</a>
        </p>
      </form>

    </div>
  </div>

</body>
</html>
